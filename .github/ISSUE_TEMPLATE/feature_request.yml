name: 💡 Feature request
description: Suggest an improvement or a new capability
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This is an early release and feedback directly shapes what gets built
        next — thanks for taking the time.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not the solution. What are you unable to do today?
      placeholder: |
        I generate batches overnight and can't tell in the morning which runs failed.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like the app to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Other tools, workarounds, or approaches you tried.

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Local generation / engine
        - Cloud generation
        - Models & downloads
        - Gallery
        - Settings
        - Translations / i18n
        - Installer & updates
        - Other
